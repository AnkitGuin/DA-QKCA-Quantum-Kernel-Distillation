[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "daqkca"
version = "0.1.0"
description = "Research prototype: distillability-aware quantum kernel co-adaptation"
requires-python = ">=3.11"
dependencies = ["torch>=2.2,<3", "numpy>=1.25,<3", "scipy>=1.11,<2", "scikit-learn>=1.3,<2", "pandas>=2,<3", "matplotlib>=3.7,<4", "PyYAML>=6,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
extra = ["xgboost>=2,<4"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
